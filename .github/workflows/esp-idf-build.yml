name: ESP-IDF Build

on:
  push:
    branches: [main]
    paths:
      - 'ikun_camera_v1.0/**'
      - 'ikun_thermal_imaging/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'ikun_camera_v1.0/**'
      - 'ikun_thermal_imaging/**'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  build:
    name: build (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: ikun_camera_v1.0/firmware
            target: esp32s3
          - project: ikun_thermal_imaging/firmware
            target: esp32s3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build with ESP-IDF
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.4.1
          target: ${{ matrix.target }}
          path: ${{ matrix.project }}

      - name: Report firmware size
        if: always()
        run: |
          echo "### ${{ matrix.project }} build artifact" >> $GITHUB_STEP_SUMMARY
          ls -lh ${{ matrix.project }}/build/*.bin 2>/dev/null >> $GITHUB_STEP_SUMMARY || echo "_no bin produced_" >> $GITHUB_STEP_SUMMARY
